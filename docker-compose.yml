services:
  # 1. Apache Kafka KRaft Broker (Zero ZooKeeper)
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: streamforge-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
      CLUSTER_ID: 'MkU3OEVBNTgwQzExMTgyNw=='
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PostgreSQL 16 Data Store
  postgres:
    image: postgres:16-alpine
    container_name: streamforge-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: streamforge
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d streamforge"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. FastAPI Telemetry & Metrics Service
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: streamforge-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/streamforge
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CORS_ORIGINS: "http://localhost:5173,http://localhost:4173,http://localhost:3000"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # 4. React Landing & Dashboard Preview
  web:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: streamforge-web
    ports:
      - "4173:4173"
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on:
      - api

  # 5. Synthetic Event Generator & Kafka Producer
  generator:
    build:
      context: ./generator
      dockerfile: Dockerfile
    container_name: streamforge-generator
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      TOPIC_NAME: ride-events
      EVENTS_PER_SECOND: "5.0"
      ENABLE_ANOMALIES: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:

